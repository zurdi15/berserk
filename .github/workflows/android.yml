# v0.13.0 — APK del shell Android (Capacitor, WebView contra el servidor).
# Se compila por tag de release y se adjunta a la GitHub Release del tag:
# distribución por APK directo u Obtainium apuntando a este repo, sin Play
# Store. La firma sale de los secrets ANDROID_* (keystore fuera del repo).
name: android

on:
  push:
    tags:
      - 'v*'
  # relanzar a mano contra una release existente (p.ej. si el build del tag
  # falló y el fix vive en un commit posterior): el dispatch corre con el
  # código del ref elegido (main) y sube la APK a la release de `tag`
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release destino (vX.Y.Z)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm ci

      - name: Sync native project
        working-directory: mobile
        run: npx cap sync android

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/berserk.keystore

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          BK_KEYSTORE_FILE: /tmp/berserk.keystore
          BK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${RELEASE_TAG#v}"
          # versionCode monotónico desde el semver del tag: 0.13.0 → 1300
          IFS=. read -r MAJOR MINOR PATCH <<< "$TAG"
          export BK_VERSION_NAME="$TAG"
          export BK_VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "berserk-${RELEASE_TAG}.apk"

      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          # la Release del tag puede no existir aún (se crea tras el workflow
          # de imagen): reintenta unos minutos antes de rendirse
          for i in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "mobile/android/berserk-${RELEASE_TAG}.apk" --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            sleep 20
          done
          echo "release del tag no encontrada tras 10 min" >&2
          exit 1
